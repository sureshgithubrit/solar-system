name: Solar system Workflow

on:
    workflow_dispatch: 
    push:
        branches:
            - main
            - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.magodb.net/superData'
  MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
  MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}
jobs:
    Unit-Testing:
        name: unit testing
        strategy:
          matrix:
            node-version: [18,19,20]
            opearting-syatem: [ubuntu-latest, macos-latest]
            exclude:
              - node-version: 18
                opearting-syatem: macos-latest

        runs-on: ${{matrix.opearting-syatem}}
        steps:
        - name: checkout Repo
          uses: actions/checkout@v4

        - name: install node version - ${{matrix.node-version}}
          uses: actions/setup-node@v4
          with:
            node-version: ${{matrix.node-version}}
            
        - name: install dependencies
          run: npm install --save-dev mongodb-memory-server
        
        - name: unit testing
          run: npm test

        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: MOcha Test Result
            path: test-result.xml
    
    code-coverage:
      name: Code Coverage
      runs-on: ubuntu-latest
      steps:
        - name: checkout Repo
          uses: actions/checkout@v4

        - name: install node version - 18
          uses: actions/setup-node@v4
          with:
            node-version: 18
            
        - name: install dependencies
          run: npm install --save-dev mongodb-memory-server
        
        - name: unit testing
          run: npm run coverage

        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: CodeCoverage Result
            path: coverage-result.xml
            retention-days: 5

        

        
      

    