name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Run unit tests
      run: |
        mkdir -p test-reports
        npm test -- --reporter mocha-junit-reporter --reporter-options mochaFile=./test-reports/junit.xml || true

    - name: Upload unit test report
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-report
        path: test-reports/junit.xml
